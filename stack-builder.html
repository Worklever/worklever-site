<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Worklever — The 5-Minute AI Stack Builder</title>
<style>
:root{--teal:#0D9488;--teal-d:#0F766E;--gold:#D9A441;--ink:#1F2E2B;--paper:#FBFAF7;--mint:#34D399;--line:#E4EAE7;--muted:#64748B;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#EFFAF7,#FBFAF7);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px}
header.brand{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--teal);position:relative;flex:0 0 auto}
.logo:after{content:"";position:absolute;left:7px;right:7px;top:9px;height:3px;background:var(--gold);
  box-shadow:0 6px 0 var(--mint);border-radius:2px}
.brandname{font-weight:800;letter-spacing:.2px;font-size:18px}
.brandname small{display:block;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.3px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;
  box-shadow:0 10px 30px rgba(11,31,26,.06)}
h1{font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.18;margin:.1em 0 .35em;color:#134E4A}
.sub{color:var(--muted);font-size:16px;margin-bottom:22px}
.btn{appearance:none;border:0;cursor:pointer;font-weight:700;font-size:16px;border-radius:999px;padding:14px 26px;
  background:var(--teal);color:#fff;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--teal-d)}
.btn.gold{background:var(--gold)} .btn.gold:hover{filter:brightness(.94)}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}
.bar{height:7px;background:#e7ece9;border-radius:6px;overflow:hidden;margin:4px 0 20px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--mint));transition:.3s}
.qnum{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--teal)}
.q{font-size:22px;font-weight:800;margin:6px 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;
  font-size:15.5px;font-weight:600;transition:.12s}
.opt:hover{border-color:var(--teal);background:#f3faf7;transform:translateY(-1px)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.link{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600}
.field{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:14px 16px;font-size:16px;margin:6px 0 14px}
.field:focus{outline:none;border-color:var(--teal)}
.fine{font-size:12.5px;color:var(--muted);margin-top:10px}
.pill{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  color:var(--teal-d);background:#e4f3ee;border-radius:999px;padding:3px 9px;margin-bottom:8px}
.result-h{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gold)}
.stackname{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:800;margin:4px 0 4px;color:#134E4A}
.tagline{color:var(--muted);font-size:15.5px;margin-bottom:18px}
.tool{border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;background:#fff}
.tool h4{margin:0 0 4px;font-size:17px}
.tool .cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
.tool .meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tag{font-size:12px;font-weight:600;border-radius:8px;padding:4px 9px;background:#f1f5f3;color:var(--ink)}
.tag.free{background:#e9f9f1;color:#0a6b4e}
.tag.cost{background:#fbf3e2;color:#8a6312}
.qs{background:#f6faf8;border-left:3px solid var(--teal);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:8px}
.qs b{color:var(--teal-d)}
.disc{font-size:11.5px;color:var(--muted);margin-top:8px;font-style:italic}
.section-h{font-size:15px;font-weight:800;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.auto ol{margin:6px 0 0;padding-left:20px} .auto li{margin:5px 0;font-size:14.5px}
.skip{background:#fff8ef;border:1px solid #f0e2c8;border-radius:12px;padding:14px 16px;margin-top:12px}
.skip .sk{font-size:14px;margin:6px 0} .skip .sk b{color:#8a6312}
.totals{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.tot{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.tot .k{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:700}
.tot .v{font-size:14px;margin-top:3px}
.cta{background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#fff;border-radius:16px;padding:22px;margin-top:20px}
.cta h3{margin:0 0 6px;font-size:19px} .cta p{margin:0 0 14px;opacity:.92;font-size:14.5px}
footer{margin-top:22px;font-size:11.5px;color:var(--muted);text-align:center}
.stamp{display:inline-block;background:#eef3f1;border:1px solid var(--line);border-radius:999px;padding:4px 12px;
  font-size:11.5px;color:var(--muted);margin-bottom:14px}
@media(max-width:520px){h1{font-size:25px}.card{padding:20px}.stackname{font-size:22px}}
</style>
</head>

    <div class="logo"></div>

</div>

<script>
const DATA = {"brand": "Worklever", "quiz": {"questions": [{"id": "q1", "key": "timesink", "prompt": "What eats the most of your week right now? Pick the one that hurts most.", "options": [{"label": "Making content (posts, emails, videos, blogs)", "value": "content"}, {"label": "Admin & busywork (data entry, notes, inbox, docs)", "value": "admin"}, {"label": "Answering the same customer questions over and over", "value": "support"}, {"label": "Finding leads & following up to win work", "value": "sales"}, {"label": "Booking, calendars & no-show wrangling", "value": "scheduling"}, {"label": "Invoices, receipts & keeping the numbers straight", "value": "finance"}]}, {"id": "q2", "key": "role", "prompt": "Which sounds most like you?", "options": [{"label": "Solo owner — I do everything myself", "value": "solo_owner"}, {"label": "Owner with a small team I delegate to", "value": "owner_team"}, {"label": "Freelancer / consultant selling my own time", "value": "freelancer"}, {"label": "Side hustle I'm growing alongside a job", "value": "side_hustle"}, {"label": "Office manager / right hand keeping it all running", "value": "operator"}]}, {"id": "q3", "key": "team_size", "prompt": "How many people actually use the tools day to day?", "options": [{"label": "Just me", "value": "just_me"}, {"label": "2-5 of us", "value": "2to5"}, {"label": "6-15 of us", "value": "6to15"}, {"label": "16+ of us", "value": "16plus"}]}, {"id": "q4", "key": "budget", "prompt": "What can you spend on tools per month — honestly?", "options": [{"label": "$0 — free only, no card", "value": "none"}, {"label": "Under $50/mo", "value": "under50"}, {"label": "$50-$150/mo", "value": "50to150"}, {"label": "Flexible if it clearly pays for itself", "value": "flexible"}]}, {"id": "q5", "key": "tech_comfort", "prompt": "Be real — how techy are you?", "options": [{"label": "Not techy. I want copy, paste, done.", "value": "none"}, {"label": "Comfortable enough to connect a few apps and tinker", "value": "some"}]}, {"id": "q6", "key": "current_tools", "prompt": "What are you already running things on? Pick the closest.", "options": [{"label": "Mostly Google (Gmail, Docs, Sheets, Calendar)", "value": "google"}, {"label": "Mostly Microsoft (Outlook, Office, Teams)", "value": "microsoft"}, {"label": "A patchwork of apps that don't talk to each other", "value": "patchwork"}, {"label": "Pen, paper & my own head — barely any tools yet", "value": "barely_any"}, {"label": "Honestly, ChatGPT and not much else", "value": "chatgpt_only"}]}], "logic_note": "Scoring is deliberately simple so the quiz feels instant and the result feels earned. ONE input picks the stack; the other five only personalise the copy around it.\n\nSTACK SELECTION (the only branching variable): q1 key:\"timesink\" maps 1:1 to the six named AI Stacks via its option values — content -> Content Stack, admin -> Admin/Ops Stack, support -> Customer-Support Stack, sales -> Sales/Outreach Stack, scheduling -> Scheduling/Booking Stack, finance -> Finance/Bookkeeping Stack. No weighting, no ties: the single selected value is the stack id. The other 5 questions never change WHICH stack is returned.\n\nBUDGET TOGGLE (free-vs-paid emphasis, never changes the stack): q4 key:\"budget\" sets which tier of each tool we lead with and how the \"honest cost\" line reads.\n- none -> lead with the free-tier/no-card tool for every slot; affiliate/paid picks demoted to a \"when you're ready to pay\" footnote; total stated cost = $0. Honesty hook fires hardest here (\"you do NOT need to pay for this yet\").\n- under50 -> free core + at most ONE paid upgrade if it clearly beats free; flag the one thing worth $X.\n- 50to150 -> recommend the paid tier where it genuinely saves more time than it costs; still name the free fallback for each.\n- flexible -> lead with the best-in-class paid pick per slot, but ALWAYS still surface the free path (hard rule: every result shows a no-budget route regardless of budget answer). Affiliate links remain FTC-disclosed at every budget level; budget only changes emphasis/order, never hides the free option.\n\nTECH-COMFORT GATE (automation complexity, never changes the stack): q5 key:\"tech_comfort\" gates the \"copy-paste first automation\" we hand over.\n- none -> only ship single-tool, copy-paste-in-one-place automations and starter prompts (e.g. paste a prompt into the tool, done). No multi-app wiring, no Zapier/Make, no API keys. Phrasing stays jargon-free.\n- some -> unlock one optional \"level-up\" automation that connects 2 apps (e.g. a simple Zapier/Make zap or a Google Sheets + AI link), shown as a clearly-labelled bonus BELOW the no-tech version so the no-tech path is never blocked.\n\nCOPY PERSONALISATION (flavour only, no logic branching): q2 key:\"role\", q3 key:\"team_size\", and q6 key:\"current_tools\" only adjust wording and examples in the result, never the stack or the tool list.\n- role -> sets the voice/example framing (solo_owner & freelancer -> \"you, personally, get X hours back\"; owner_team & operator -> \"your team stops doing X by hand\"; side_hustle -> \"keep this running in the margins of your job\").\n- team_size -> just_me drops any seat/collaboration mentions; 2to5/6to15/16plus add a one-line note on per-seat cost and which picks have a usable free team tier (kept honest, no upsell).\n- current_tools -> picks the integration-friendly variant and example wording: google -> prefer tools with clean Google/Sheets/Gmail hooks; microsoft -> prefer Outlook/Office-friendly picks and Copilot-adjacent notes; patchwork -> add a gentle \"consolidate, don't add more apps\" honesty line; barely_any -> start with the absolute simplest free tool and skip integrations entirely; chatgpt_only -> show how far the free/Plus ChatGPT they already have covers a slot before adding anything new (anti-slop: don't sell a second tool that overlaps what they already pay for).\n\nGLOBAL GUARDRAILS baked into every result regardless of answers: real tools only with honest current-pricing language; a free-tier/no-budget path always present; affiliate links FTC-disclosed; explicit \"skip this one\" calls where a tool isn't worth it; and no personalised financial/legal/medical advice (finance stack stays at \"organise receipts / draft invoices / categorise expenses to hand to your bookkeeper\" — never tax or financial advice)."}, "stacks": {"stacks": [{"id": "content", "timesink_label": "Making content (posts, emails, blogs, graphics) eats my week", "stack_name": "The Content Engine", "tagline": "Go from blank page to posted in under an hour — without sounding like a robot.", "tools": [{"name": "ChatGPT (OpenAI)", "category": "General AI assistant (writing & brainstorming)", "what_it_does": "All-purpose AI that drafts captions, emails, blog outlines, and headlines from a rough idea you type in.", "monthly_cost": "Free, or Plus $20/mo (check current price — OpenAI changes tiers often)", "free_alt": "The free tier is genuinely usable for weekly content: you get access to the current default model with a message cap that resets every few hours. Most owners start here and only move to Plus when they hit the cap daily or want longer documents and faster responses. Start free; upgrade only when the limit actually slows you down.", "affiliate_program": "None — OpenAI runs no consumer affiliate program. This is our honest #1 pick on merit, not because we earn from it.", "starter_prompt": "You are my marketing copywriter. My business is [WHAT YOU SELL] for [WHO YOU SERVE, e.g. busy parents in Austin]. Write 5 Instagram captions about [TOPIC OR OFFER]. Rules: each under 125 words, warm and plainspoken (no corporate jargon, no emojis, no hashtags), and end each with ONE clear call to action that points to [WHERE YOU WANT THEM TO GO, e.g. the link in bio]. Number them 1–5."}, {"name": "Canva", "category": "Design (no-designer graphics & video)", "what_it_does": "Drag-and-drop design tool that turns templates into branded social posts, thumbnails, PDFs, and short videos, with built-in AI image and text helpers.", "monthly_cost": "Free, or Pro ~$13–15/mo (around $120/yr billed annually — check current price)", "free_alt": "The free tier is excellent and permanent: a huge template library, plenty of free photos and elements, and the basic design tools. Many solopreneurs never need to pay. Upgrade to Pro mainly for the Brand Kit (saved logo/colors/fonts), the one-click background remover, and the premium asset library — not for the core design work.", "affiliate_program": "Affiliate link (FTC-disclosed). If you sign up through our link we may earn a commission at no extra cost to you. We recommend Canva on merit and the free tier costs you nothing.", "starter_prompt": "Open a Canva social-post template, click into a text box, and use Magic Write: 'Write 3 short on-image text overlays for a promo about [OFFER], each 6 words or fewer, punchy and benefit-led, aimed at [TARGET CUSTOMER].' Pick the best one, then use 'Resize' (Pro) or duplicate the design to make Instagram square, Story (9:16), and LinkedIn (1:1) versions."}, {"name": "Grammarly", "category": "Writing quality (grammar, clarity, tone)", "what_it_does": "Checks grammar, spelling, clarity, and tone in real time across email, docs, and the web so non-writers sound professional.", "monthly_cost": "Free, or Pro roughly $12–30/mo depending on billing (cheapest billed annually — check current price)", "free_alt": "The free tier covers the core value for most people: grammar, spelling, punctuation, and basic tone and clarity suggestions, plus a small monthly allowance of generative AI prompts. Be honest with yourself — if free already makes your writing clean, you don't need Pro.", "affiliate_program": "Affiliate link (FTC-disclosed). We may earn a commission if you upgrade through our link, at no extra cost to you. The free tier is enough for most readers and we say so.", "starter_prompt": "Paste your draft into the Grammarly editor, then open 'Goals' and set: Audience = General, Formality = Informal, Tone = Confident + Friendly. Accept the clarity and correctness flags, then run one AI rewrite: 'Make this clearer and about 20% shorter without changing my voice or adding new claims.'"}, {"name": "Buffer", "category": "Social scheduling", "what_it_does": "Queues and auto-publishes your finished posts to multiple social channels on a set schedule so you can batch a week in one sitting.", "monthly_cost": "Free, or paid from roughly $5–6 per channel/mo (check current price)", "free_alt": "The free plan connects up to 3 channels and lets you queue a handful of scheduled posts per channel — enough to batch a week ahead for most solo owners. Upgrade only when you need more channels, a deeper queue, or analytics.", "affiliate_program": "None / direct. We recommend Buffer on merit for its honest free tier; we don't earn from it.", "starter_prompt": "Buffer isn't a prompt tool — it's where your finished work goes. Workflow: connect your 3 channels, paste each ChatGPT caption, attach its matching Canva graphic, and set the queue to your 3 best posting times for the week. Use Buffer's built-in AI assistant only to repurpose one longer post into 2–3 shorter ones if you run short on ideas — not to write from scratch."}], "first_automation": {"title": "Batch a full week of social posts in one 45-minute sitting", "steps": ["In ChatGPT, run the starter prompt to draft 5 captions for the week around one theme or offer.", "Paste each caption into Grammarly, set tone to Confident + Friendly, and run a quick clarity pass.", "In Canva, open one branded template and make 5 matching graphics (duplicate the page, swap the text/photo each time).", "Open Buffer, connect your 3 channels, and add each caption with its graphic attached.", "Set the queue to your 3 best posting times for the week and hit Schedule.", "Done — you batched a week in under an hour and nothing posts off-brand."]}, "skip_these": [{"tool": "Jasper or Copy.ai (dedicated AI copywriters)", "why": "At roughly $39–49/mo they mostly do what ChatGPT already does for you on the free or $20 tier. Don't pay twice for AI writing — start with the general assistant and only add a specialized copywriter if you genuinely outgrow it. (Note: we hold a Jasper affiliate link, and we're still telling you to skip it for this profile.)"}, {"tool": "A second paid general-AI subscription (e.g. paying for BOTH ChatGPT and Claude)", "why": "For weekly content you only need one paid general-AI sub. Pick ChatGPT or Claude — not both — and put the saved $20 toward Canva Pro or your scheduler instead."}], "total_paid_cost": "Roughly $32–53/mo if you pay for everything: ChatGPT Plus $20 + Canva Pro ~$13–15 + one Buffer channel ~$6, with Grammarly Pro optional (~$12). Prices change — check each before subscribing.", "total_free_note": "You can run this entire engine for $0: ChatGPT free for drafts, Canva free for design, Grammarly free for polish, Buffer free for up to 3 channels. The only real limits are ChatGPT's rolling message cap and a smaller Buffer queue — both fine for batching one week at a time."}, {"id": "admin", "timesink_label": "Admin, notes, docs, and SOPs are scattered everywhere", "stack_name": "The Clear-Desk Stack", "tagline": "One home for everything, so 'where did I put that?' stops costing you hours.", "tools": [{"name": "Notion", "category": "Organization (all-in-one workspace)", "what_it_does": "One workspace for notes, docs, project tracking, simple databases, and SOPs that replaces a messy folder of scattered docs and spreadsheets.", "monthly_cost": "Free, or Plus $10/mo, Business $20/mo (annual billing — check current price)", "free_alt": "The free plan covers notes, docs, and databases for a solo owner — enough to get fully organized. Honest nuance on AI: the Plus plan includes basic AI writing help, while the full AI features (Ask Notion / AI agents across your whole workspace) live on Business. On free or Plus you can simply use ChatGPT alongside Notion instead of paying up for AI.", "affiliate_program": "Affiliate (FTC-disclosed) — but heads up: as of 2026 Notion's direct affiliate program is reportedly closed to new sign-ups (you'd have to apply via a network or join a waitlist). If our link isn't live yet, treat this as an unaffiliated, on-merit recommendation. Either way it costs you nothing extra.", "starter_prompt": "Paste into ChatGPT to design your workspace: 'I run a [TYPE OF BUSINESS] as a solo owner / [TEAM SIZE] person team. Design a simple Notion setup with 3 databases — Clients, Projects, and SOPs. For each, list the exact properties (columns) I should create and the property type (text, select, date, etc.). Keep it minimal and explain in plain English — I'm not technical.'"}, {"name": "ChatGPT (OpenAI)", "category": "General AI assistant (drafting & summarizing)", "what_it_does": "Drafts SOPs, summarizes long emails or documents, and turns your messy bullet notes into clean, structured text you can drop into Notion.", "monthly_cost": "Free, or Plus $20/mo (check current price)", "free_alt": "Free tier handles almost all admin drafting and summarizing. You'd only want Plus if you're feeding it long documents daily or hitting the message cap regularly. Start free.", "affiliate_program": "None — OpenAI has no consumer affiliate program. Recommended purely on merit.", "starter_prompt": "Turn a task into a reusable SOP: 'Here are my rough notes for how I [DO A RECURRING TASK, e.g. onboard a new client]: [PASTE YOUR BULLET NOTES]. Rewrite this as a clear, numbered standard operating procedure a brand-new assistant could follow with zero context. Add a short checklist at the end. Keep it under one page.'"}, {"name": "Google Workspace (Gmail, Docs, Drive)", "category": "Core docs & email (foundation)", "what_it_does": "Your email, documents, and file storage in one account — the backbone most small businesses already run on, with AI features layered on the paid tiers.", "monthly_cost": "Free with a personal Google account, or Workspace from roughly $7–14/user/mo for a custom domain (check current price)", "free_alt": "A free personal Google account already gives you Gmail, Docs, Sheets, and 15GB of Drive storage — plenty to run admin for a solo business. You only need paid Workspace when you want email at your own domain (you@yourbusiness.com) and shared team drives. Don't pay until you need the custom domain.", "affiliate_program": "None / direct. Recommended on merit as the foundation most owners already have.", "starter_prompt": "Not a prompt tool — it's your filing system. Set this up once: in Drive, create three top-level folders — 'Clients', 'Admin & Finance', and 'Templates' — and move your scattered files in. Then bookmark them. The win is one obvious home for every file, so search actually finds things."}], "first_automation": {"title": "Build your 'second brain' and turn one messy process into a reusable SOP", "steps": ["In ChatGPT, run the workspace-design prompt and copy the suggested Clients / Projects / SOPs structure.", "In Notion, create those 3 databases with the exact columns ChatGPT listed (use the free templates as a starting point).", "Pick your single most-repeated task and dump your rough notes into the SOP starter prompt.", "Paste the clean SOP ChatGPT returns into your Notion SOPs database.", "In Google Drive, create matching top-level folders so files and docs line up with your Notion structure.", "Next time you do that task, follow the SOP — and tweak it once. Now it's documented forever."]}, "skip_these": [{"tool": "Notion Business plan, on day one", "why": "At $20/mo the Business tier is overkill for a solo owner who just wants to get organized. Start on free or Plus and pair it with ChatGPT for AI. Upgrade to Business only if you build a team or genuinely need workspace-wide AI search."}, {"tool": "A dedicated AI 'note-taker' app (e.g. Mem, Reflect) on top of Notion", "why": "Layering a second smart-notes app on top of Notion just splits your information across two places — the exact problem you're trying to solve. Pick one home (Notion) and keep everything there."}], "total_paid_cost": "Roughly $30/mo if you pay for everything: Notion Plus $10 + ChatGPT Plus $20, with Google Workspace optional (~$7–14/user) only if you want a custom-domain email. Check current prices.", "total_free_note": "This whole stack runs at $0: Notion free for your workspace, ChatGPT free for drafting and summarizing, and a free Google account for email, docs, and 15GB of storage. You only start paying when you want workspace-wide AI search or email at your own domain."}, {"id": "support", "timesink_label": "Answering the same customer questions over and over eats my day", "stack_name": "The Always-On Helpdesk", "tagline": "Answer once, then let AI handle the repeats — so you stop retyping the same reply.", "tools": [{"name": "Tidio", "category": "Website chat + AI support bot", "what_it_does": "Adds a chat widget to your website and uses an AI bot to answer common customer questions automatically, handing off to you when it's something real.", "monthly_cost": "Free, or paid plans from roughly $25–29/mo; AI features (Lyro) are metered by conversation (check current price)", "free_alt": "The free plan gives you live chat plus a limited number of free AI (Lyro) conversations per month — enough for a low-traffic site to test whether the bot actually deflects your repeat questions before you pay. Start free and watch your real conversation volume.", "affiliate_program": "None / direct in our kit. Recommended on merit; if we add an affiliate link later we'll disclose it here.", "starter_prompt": "Feed the bot your real answers first. In ChatGPT: 'Here are the 10 questions customers ask me most and my real answers: [PASTE THEM]. Rewrite each answer to be friendly, under 60 words, and in plain English, so I can paste them into my support bot's knowledge base. Keep my actual policies exactly as I stated them — don't invent details.'"}, {"name": "ChatGPT (OpenAI)", "category": "General AI assistant (drafting replies & FAQs)", "what_it_does": "Drafts polished replies to tricky customer emails and turns your scattered answers into a clean, reusable FAQ and canned-response library.", "monthly_cost": "Free, or Plus $20/mo (check current price)", "free_alt": "Free tier easily handles drafting support replies and building your FAQ. No need to pay unless you're doing very high volume daily. Start free.", "affiliate_program": "None — OpenAI has no consumer affiliate program. On merit.", "starter_prompt": "Draft a calm reply to a hard message: 'A customer wrote me this [PASTE THEIR MESSAGE]. My situation / policy is [WHAT'S ACTUALLY TRUE, e.g. refunds within 14 days only]. Write a warm, professional reply under 120 words that holds my policy, acknowledges their feelings, and offers one concrete next step. Don't promise anything I didn't say is true.'"}, {"name": "Help Scout", "category": "Shared inbox / help desk", "what_it_does": "Turns your support email into a proper shared inbox with saved replies, so common questions get answered in two clicks instead of retyped.", "monthly_cost": "Free tier available; paid plans from roughly $20–25/user/mo (check current price)", "free_alt": "Help Scout offers a free plan that covers a shared inbox and saved replies for a small volume of contacts — enough for a solo or tiny team to stop drowning in a personal Gmail inbox. If you're truly just starting, even Gmail templates (free) plus the ChatGPT-built canned answers will do the job at $0.", "affiliate_program": "None / direct in our kit. On merit; any future affiliate link will be disclosed here.", "starter_prompt": "Not a prompt tool — it's where your saved replies live. Setup: take the 10 FAQ answers ChatGPT cleaned up and save each as a 'saved reply' / template in your inbox. Now the next time that question lands, it's two clicks, not five minutes of typing."}], "first_automation": {"title": "Turn your 10 most-repeated questions into instant, reusable answers", "steps": ["List the 10 questions customers ask you most often (check your sent email for the real ones).", "Run the ChatGPT FAQ prompt to rewrite all 10 answers in a friendly, consistent voice — with your real policies intact.", "Paste those answers into your help desk as saved replies (Help Scout) or into your bot's knowledge base (Tidio).", "Add the Tidio chat widget to your site (or just use saved replies in your inbox if you have no website yet).", "Test it: ask the bot two of your real questions and confirm the answers are correct before going live.", "From now on, repeat questions get answered in two clicks — or before they ever reach you."]}, "skip_these": [{"tool": "Intercom or Zendesk (enterprise help desks)", "why": "These are powerful but priced and built for support teams, not solo owners — you'll pay a lot for features you won't touch. Start with a free shared inbox plus saved replies and only graduate up when your ticket volume genuinely demands it."}, {"tool": "A fully autonomous AI agent that replies to customers with no review", "why": "Letting AI send customer replies unsupervised is how you end up apologizing for a confidently wrong answer or a made-up policy. Keep a human (you) in the loop on anything beyond your pre-approved FAQ answers — review before it sends."}], "total_paid_cost": "Roughly $20–50/mo if you pay: a Tidio or Help Scout paid plan (~$20–29) and ChatGPT Plus optional (+$20). AI chat usage is often metered, so watch your conversation count. Check current prices.", "total_free_note": "You can run real support for $0: free ChatGPT to build your FAQ and draft replies, a free help-desk or shared-inbox tier (or even Gmail templates) for saved answers, and Tidio's free chat plus its limited free AI conversations. Pay only once your volume outgrows the free caps."}, {"id": "sales", "timesink_label": "Following up with leads and writing outreach eats my selling time", d risks your domain reputation and spam complaints — not where a non-technical owner should start. Master warm, personalized 1-to-1 follow-up first; it converts better and won't get your email blacklisted."}, {"tool": "A paid HubSpot Sales tier on day one", "why": "The free CRM already tracks leads, deals, and email opens. Don't pay for sequences and automation until you've actually outgrown manually sending templates — most solo owners haven't. The paid jump is steep for features you may not use yet."}], "total_paid_cost": "Roughly $20–40/mo if you pay: ChatGPT Plus optional (+$20) and Google Workspace optional (~$7–14) for custom-domain email. HubSpot's core CRM stays free. Check current prices.", "total_free_note": "This runs at $0: HubSpot's free CRM to track every lead, free ChatGPT to write personalized outreach and follow-ups, and free Gmail templates to send and reuse them. You don't need a single paid tool to stop losing warm leads."}, {"id": "scheduling", "timesink_label": "Back-and-forth booking and calendar chaos eats my time", "stack_name": "The Self-Booking Calendar", "tagline": "Send one link, kill the email tag — clients book themselves around your real availability.", "tools": [{"name": "Calendly", "category": "Scheduling (self-booking links)", "what_it_does": "Shares a link where clients pick an open slot that syncs to your calendar — no more 'does Tuesday work?' email chains.", "monthly_cost": "Free, or paid from roughly $10–12/user/mo (check current price)", "free_alt": "The free plan covers the core job completely: one event type, unlimited bookings, and calendar sync — plenty for a solo owner who offers one kind of call. Upgrade only when you need multiple event types, reminders/workflows, or to collect payment at booking.", "affiliate_program": "None / direct in our kit. On merit; any future affiliate link will be disclosed here.", "starter_prompt": "Not a prompt tool — it's your booking page. Setup: create one event type (e.g. '30-min intro call'), connect your Google or Outlook calendar, and set your real working hours plus a buffer between calls. Use ChatGPT to write the confirmation message: 'Write a warm 2-sentence booking confirmation for a [TYPE OF CALL] that tells them what to prepare and how to reschedule.'"}, {"name": "Google Calendar", "category": "Calendar (source of truth)", "what_it_does": "The free calendar your booking link reads from, so you only ever get booked when you're actually free.", "monthly_cost": "Free with a Google account", "free_alt": "Completely free and the backbone of this stack — it's what keeps a booking tool from double-booking you. Block your personal/busy time here and the scheduler respects it automatically.", "affiliate_program": "None / direct. On merit.", "starter_prompt": "Not a prompt tool — it's your availability. Setup: create a recurring 'Focus / Not bookable' block for the hours you never want calls, plus blocks for school runs, lunch, etc. Your booking link reads these, so clients can only grab the time you actually want to give."}, {"name": "ChatGPT (OpenAI)", "category": "General AI assistant (reminders & comms)", "what_it_does": "Writes your booking confirmations, reminder emails, and reschedule/no-show messages so every touchpoint sounds professional.", "monthly_cost": "Free, or Plus $20/mo (check current price)", "free_alt": "Free tier writes every scheduling message you'll need. No reason to pay for this use case. Start free.", "affiliate_program": "None — OpenAI has no consumer affiliate program. On merit.", "starter_prompt": "Write a polite no-show / reschedule message: 'A client missed our scheduled [TYPE OF CALL] and didn't cancel. Write a warm, non-judgmental email under 80 words that assumes good intent, includes my booking link to rebook, and keeps the door open. No guilt-tripping.'"}], "first_automation": {"title": "Replace booking email tag with one self-serve link", "steps": ["Block your genuinely-unavailable hours in Google Calendar (focus ays know what you're owed and what you've spent.", "monthly_cost": "Free core accounting & invoicing; payments charge standard per-transaction processing fees, and some features (e.g. some payroll/advanced tiers) are paid (check current price)", "free_alt": "Wave's invoicing and accounting are free to use — you only pay the normal card/bank processing fee when a client actually pays you online (which any tool charges). For a solo owner or freelancer this is the honest place to start: clean invoices and books at $0 in subscription cost.", "affiliate_program": "None / direct in our kit. Recommended on merit for its free core; any future affiliate link will be disclosed here.", "starter_prompt": "Not a prompt tool — it's your invoicing. Setup: add your logo and business details, create one invoice template, and turn on online payments if you want clients to pay by card. Use ChatGPT to write a polite payment-reminder: 'Write a friendly reminder under 70 words for an invoice that's [X DAYS] overdue, professional and warm, that restates the amount and the due date and makes paying easy.'"}, {"name": "ChatGPT (OpenAI)", "category": "General AI assistant (explaining & drafting, NOT advice)", "what_it_does": "Explains bookkeeping terms in plain English, drafts payment reminders, and helps you organize expense categories — so the money side feels less intimidating.", "monthly_cost": "Free, or Plus $20/mo (check current price)", "free_alt": "Free tier covers explaining concepts and drafting finance messages. No need to pay for this. Start free.", "affiliate_program": "None — OpenAI has no consumer affiliate program. On merit.", "starter_prompt": "Use it to understand, not to decide: 'Explain in plain English what the difference is between [TERM A] and [TERM B] for a small business owner, with one simple example each.' Important: ChatGPT is not your accountant — use it to learn the language, then confirm anything that affects taxes or filings with a licensed professional."}, {"  freelancer needs — you'll pay for payroll and reporting features you won't use yet. Start with Wave's free core; move to QuickBooks/Xero later if your accountant asks for it or you add employees and inventory."}, {"tool": "AI tools that promise to 'do your taxes' or give tax advice", "why": "This crosses into personalized financial advice, which AI is not qualified or licensed to give — and getting it wrong is expensive. Use AI to understand the terms and organize your records, then hand the actual filing to a licensed accountant or tax pro."}], "total_paid_cost": "Roughly $0–20/mo in subscriptions: Wave's core is free (you pay only standard per-transaction processing fees when clients pay online), business checking is often free, and ChatGPT Plus is optional (+$20). Check current fees and prices.", "total_free_note": "You can run your finances at $0 in subscription cost: Wave's free invoicing and accounting, a no-monthly-fee business bank account, and free ChatGPT to explain the jargon and draft reminders. Note: this stack helps you organize and get paid — it is not financial, tax, or legal advice; confirm anything that affects your taxes with a licensed professional."}]}, "copy": {"headline": "The 5-Minute AI Stack Builder", "subhead": "Answer 7 questions. Get a personalized AI Stack — 3 to 5 real tools matched to your biggest time-sink, with honest costs, free-tier options, a copy-paste first automation, and a starter prompt for each. No code. No hype. Built for non-technical small-business owners.", "email_gate_copy": "Your Stack is built — drop in your email and we'll send the full thing. Here's exactly what lands in your inbox: a named bundle of 3-5 tools picked for your specific time-sink, what each one really costs (and which to run free), one copy-paste automation you can set up today, and a starter prompt per tool so you're not staring at a blank box. We'll also send the occasional honest teardown — the \"use this, skip that\" emails that are the whole point of Worklever. No spam, no daily blasts, no selling your address to anyone. Unsubscribe in one click whenever you want. We only need your email so we can send the Stack and keep it useful.", "result_intro": "Here's your AI Stack. We built it around the one thing eating most of your week — and we left out anything you don't actually need. A few of these are paid, a few are free, and where a free tier does the job we'll tell you straight to skip the upgrade. Start with the first tool and the copy-paste automation under it; that's your fastest 5 hours back. The rest are there when you're ready, not homework for tonight.", "affiliate_disclosure": "Heads up: some links below are affiliate links, which means Worklever may earn a small commission if you sign up — at no extra cost to you. It never changes which tools we recommend or where they rank. We list the free options right alongside the paid ones, and we'll tell you when the free tier is genuinely all you need.", "footer_note": "Worklever is an independent channel sharing AI tools and workflows for small-business owners. This is general information to help you work faster — not personalized financial, legal, or medical advice. Tool prices and free tiers change often; always double-check current pricing on the tool's own site before you buy. Worklever is a brand of STRATA."}};
const BRAND = DATA.brand;
const Q = DATA.quiz.questions;
const app = document.getElementById('app');
const answers = {};
let qi = 0;

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function progress(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>';}

function renderIntro(){
  const c = DATA.copy;
  app.innerHTML =
    '<span class="pill">Free · takes 2 minutes</span>'+
    '<h1>'+esc(c.headline)+'</h1>'+
    '<p class="sub">'+esc(c.subhead)+'</p>'+
    '<button class="btn" id="start">Build my AI Stack &rarr;</button>'+
    '<p class="fine">'+esc(c.footer_note||'')+'</p>';
  document.getElementById('start').onclick = ()=>{qi=0;renderQ();};
}

function renderQ(){
  const q = Q[qi];
  const pct = Math.round((qi/(Q.length))*100);
  let html = progress(pct)+
    '<div class="qnum">Question '+(qi+1)+' of '+Q.length+'</div>'+
    '<div class="q">'+esc(q.prompt)+'</div><div class="opts">';
  q.options.forEach((o,idx)=>{ html += '<button class="opt" data-v="'+esc(o.value)+'">'+esc(o.label)+'</button>'; });
  html += '</div><div class="row"><button class="link" id="back">'+(qi>0?'&larr; Back':'')+'</button><span></span></div>';
  app.innerHTML = html;
  [...app.querySelectorAll('.opt')].forEach(b=>b.onclick=()=>{
    answers[q.key]=b.getAttribute('data-v');
    if(qi<Q.length-1){qi++;renderQ();} else {renderGate();}
  });
  const back=document.getElementById('back'); if(back&&qi>0) back.onclick=()=>{qi--;renderQ();};
}

function renderGate(){
  const c = DATA.copy;
  app.innerHTML = progress(100)+
    '<span class="pill">Your stack is ready</span>'+
    '<div class="q">Where should we send it?</div>'+
    '<p class="sub">'+esc(c.email_gate_copy)+'</p>'+
    '<form id="gate"><input class="field" type="email" id="email" placeholder="you@yourbusiness.com" required/>'+
    '<button class="btn gold" type="submit">Show my AI Stack &rarr;</button></form>'+
    '<div class="row"><button class="link" id="back">&larr; Back</button></div>';
  document.getElementById('back').onclick=()=>{qi=Q.length-1;renderQ();};
  document.getElementById('gate').onsubmit=(e)=>{
    e.preventDefault();
    captureEmail(document.getElementById('email').value);   // <-- operator: wire to email tool
    renderResult();
  };
}

function captureEmail(email){ /* DEMO: stored client-side only. Wire to your email provider. */ window.__lead_email=email; }

function toolCard(t){
  const isAff = /^affiliate/i.test(t.affiliate_program||'');
  let meta = '<div class="meta"><span class="tag cost">'+esc(t.monthly_cost)+'</span>';
  if(t.free_alt) meta += '<span class="tag free">Free path: '+esc(t.free_alt)+'</span>';
  meta += '</div>';
  let disc = '';
  if(t.affiliate_program){
    disc = '<div class="disc">'+esc(t.affiliate_program)+'</div>';
  }
  return '<div class="tool"><div class="cat">'+esc(t.category)+'</div>'+
    '<h4>'+esc(t.name)+'</h4><div>'+esc(t.what_it_does)+'</div>'+meta+
    '<div class="qs"><b>Quick-start &rarr;</b> '+esc(t.starter_prompt)+'</div>'+disc+'</div>';
}

function renderResult(){
  const s = DATA.stacks.stacks.find(x=>x.id===answers['timesink']) || DATA.stacks.stacks[0];
  const c = DATA.copy;
  const budget = answers['budget']; const tech = answers['tech_comfort'];
  let note = '';
  if(budget==='none') note = "You told us budget is tight — so we've highlighted the <b>$0 free path</b> for every tool. You can run this whole stack without paying a cent.";
  else if(budget==='under50') note = "On a small budget, start free and only upgrade the <b>one</b> tool that saves you the most time first.";
  else note = "You've got room to invest — but still start with the free tiers and only pay where you feel the limit.";
  if(tech==='none') note += " Not techy? Good — every step below is no-code, and you only need the <b>first automation</b> to get a win this week.";

  let html =
    '<div class="result-h">Your AI Stack</div>'+
    '<div class="stackname">'+esc(s.stack_name)+'</div>'+
    '<div class="tagline">'+esc(s.tagline)+'</div>'+
    '<p class="sub" style="margin-top:-6px">'+esc(c.result_intro)+'</p>'+
    '<div class="skip" style="background:#eef5f2;border-color:#d4e6df"><div class="sk">'+note+'</div></div>';

  html += '<div class="section-h">🧰 Your '+s.tools.length+' tools</div>';
  s.tools.forEach(t=>html+=toolCard(t));

  html += '<div class="section-h">⚡ Do this first (week-one win)</div>'+
    '<div class="auto"><b>'+esc(s.first_automation.title)+'</b><ol>'+
    s.first_automation.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>';

  html += '<div class="section-h">🚫 We left these out — on purpose</div><div class="skip">'+
    s.skip_these.map(x=>'<div class="sk"><b>'+esc(x.tool)+'</b> — '+esc(x.why)+'</div>').join('')+'</div>';

  html += '<div class="totals">'+
    '<div class="tot"><div class="k">If you pay for everything</div><div class="v">'+esc(s.total_paid_cost)+'</div></div>'+
    '<div class="tot"><div class="k">The $0 path</div><div class="v">'+esc(s.total_free_note)+'</div></div></div>';

  html += '<div class="cta"><h3>Want the next workflow built for you?</h3>'+
    '<p>New honest, no-hype AI workflow every week — saving '+BRAND+' readers real hours. Check your inbox: your stack + a 5-day setup guide are on the way.</p>'+
    '<button class="btn gold" id="again">Build another stack</button></div>';

  app.innerHTML = html;
  document.getElementById('again').onclick=()=>{for(const k in answers)delete answers[k];qi=0;renderIntro();};
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('ftc').innerHTML =
  '<div class="stamp">Tool prices as of June 2026 — always check the current price before subscribing.</div><br/>'+
  esc(DATA.copy.affiliate_disclosure)+'<br/>'+
  'This tool gives software suggestions only — not financial, legal, or tax advice. © '+BRAND;

renderIntro();
</script>
